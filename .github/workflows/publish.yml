name: Publish to npm

# Publishes @ignitionai/cogitator with npm trusted publishing (OIDC): no npm token is stored.
# One-time setup on npmjs.com → package settings → Trusted publisher:
#   GitHub Actions, organization IgnitionAI, repository cogitator, workflow publish.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Skip if this version is already on npm
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@ignitionai/cogitator@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@ignitionai/cogitator@$VERSION is already published"
          fi

      # prepublishOnly runs the full build and test suite before publishing.
      - if: steps.published.outputs.already != 'true'
        run: npm publish --access public
